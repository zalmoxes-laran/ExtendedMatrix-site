name: Build site

# Build the site on every push and PR.
# Deploy is intentionally split out so we can switch hosting (GitHub Pages /
# Cloudflare Pages / Netlify) without touching the build pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The ontology and em.json pages are regenerated from s3Dgraphy at every
  # build (step «Republish CRMem and em.json» below). This schedule makes a
  # change in s3Dgraphy reach the site within six hours even when nothing is
  # pushed here.
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The Blender add-on catalog lives in the BlenderAddons4CH repo,
          # included here as a git submodule (vendor/blenderaddons4ch). The
          # prebuild sync copies its data into the content collection.
          submodules: recursive

      # ── CRMem and em.json, republished from their source ────────────────
      # The ontology page (public/ontology/) and the em.json specification
      # (public/spec/em-json/, public/schemas/) are copies of what lives in
      # s3Dgraphy. Regenerating them here, from the published line, keeps the
      # site from drifting behind (on 2026-10-27 the ontology page was four
      # versions old). The copies committed in this repository stay as the
      # fallback: if s3Dgraphy cannot be read, the build goes on with them.
      - name: Checkout s3Dgraphy (source of the ontology and em.json pages)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: ExtendedMatrix/s3Dgraphy
          ref: s3dgraphy_v1.6dev
          path: _s3dgraphy
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.11'

      - name: Republish CRMem and em.json
        continue-on-error: true
        run: |
          python -m pip install --quiet 'rdflib>=7.0' 'markdown-it-py>=3.0'
          PYTHONPATH=_s3dgraphy/src python -m s3dgraphy.tools.ontology_html --out public/ontology
          python _s3dgraphy/spec/em-json/tools/publish_site.py .
          head -2 public/ontology/em.ttl
          rm -rf _s3dgraphy

      - name: Setup Node
        # v5+ runs on Node 24 natively (v4 targeted Node 20, which GitHub
        # deprecated on 2026-Q3 — the runner was forcibly upgrading it to
        # Node 24 anyway, triggering the "Node.js 20 is deprecated" warning
        # on every build). Bumped 2026-07-06 to silence that warning and
        # align with the current LTS. Node 22 (Jod) is the active LTS at
        # the time of this bump.
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check & build
        # src/lib/upstream.ts reads versions and installers from the GitHub
        # API at build time. Without a token the limit is 60 requests/hour
        # per IP, shared across runners: on 2026-10-13 that read failed and
        # /tools/emstudio/ went live without its download section. The
        # token (contents: read, above) raises it to 1000/hour. With CI=true
        # (set by Actions) a source that cannot be read fails this step.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload build artifact
        # v5 (released 2026-04-10) uses actions/upload-artifact@v7
        # underneath — the transitive dependency that triggered the
        # "Node.js 20 is deprecated" warning on v3. Bumped alongside
        # setup-node v5 and deploy-pages v5 in the 2026-07-06 pass.
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ── Deploy to GitHub Pages (default) ────────────────────────────────
  # If you switch to Cloudflare Pages or Netlify, remove this job and
  # replace it with the connector for that host (Cloudflare Pages action
  # or Netlify CLI deploy). The build artifact above is what gets shipped.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v5 runs on Node 24 natively (v4 targeted Node 20).
        uses: actions/deploy-pages@v5
